<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <!-- Outer membrane gradient -->
    <linearGradient id="memGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </linearGradient>
  </defs>

  <!-- Dark Titanium App Tile -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#2a2a30" stroke-width="1.2"/>

  <!-- Tilted Mitochondrion (-32 degrees) -->
  <g transform="rotate(-32 32 32)">
    <!-- Outer Membrane -->
    <rect x="5" y="18" width="54" height="28" rx="14" fill="url(#memGrad)" stroke="#a1a1aa" stroke-width="1.8"/>
    
    <!-- Intermembrane Space / Matrix -->
    <rect x="8.5" y="21.5" width="47" height="21" rx="10.5" fill="#141418"/>

    <!-- Cristae Fold 1 (Top Down) -->
    <path d="M 17,21.5 C 17,28.5 21.5,28.5 21.5,21.5" fill="none" stroke="#e4e4e7" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Cristae Fold 2 (Bottom Up) -->
    <path d="M 32,42.5 C 32,34.5 36.5,34.5 36.5,42.5" fill="none" stroke="#e4e4e7" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Cristae Fold 3 (Top Down) -->
    <path d="M 41,21.5 C 41,29.5 45.5,29.5 45.5,21.5" fill="none" stroke="#e4e4e7" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Primary Circular mtDNA Plasmid Loop (Gold) -->
    <circle cx="27" cy="33.5" r="4.2" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="2.2 1.2"/>
    <circle cx="27" cy="33.5" r="1.6" fill="#fbbf24"/>

    <!-- Secondary Circular mtDNA Plasmid Loop (Gold) -->
    <circle cx="48" cy="31" r="3.0" fill="none" stroke="#f59e0b" stroke-width="1.3" stroke-dasharray="1.8 1"/>
    <circle cx="48" cy="31" r="1.1" fill="#fbbf24"/>

    <!-- Matrix Granules -->
    <circle cx="14" cy="32" r="0.9" fill="#a1a1aa"/>
    <circle cx="38" cy="27" r="0.8" fill="#a1a1aa"/>
  </g>
</svg>